services:
  db:
    image: postgres:15-alpine
    container_name: realestate-db
    restart: always
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: realestate_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U db_user -d realestate_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: realestate-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: realestate-backend:latest
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: realestate-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://db_user:db_password@db:5432/realestate_db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false 
    volumes:
      - ../../backend/data/FOLDER_DATASET:/app/data/FOLDER_DATASET
      - ../../backend/data/FOLDER_STATIC_ROME:/app/data/FOLDER_STATIC_ROME
      - ../../backend/data/FOLDER_APE:/app/data/FOLDER_APE
      - ../../backend/data/FOLDER_META:/app/data/FOLDER_META
      - ../../backend/data/FOLDER_DATABASE:/app/data/FOLDER_DATABASE
      - ../../backend/data/runs:/app/runs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: realestate-frontend:latest
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: realestate-frontend
    restart: always
    ports:
      - "8890:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
