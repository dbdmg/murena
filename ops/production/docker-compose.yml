name: realestateai
services:
  db:
    image: postgres:15-alpine
    container_name: mef-db
    restart: always
    environment:
      POSTGRES_USER: mef_user
      POSTGRES_PASSWORD: mef_password
      POSTGRES_DB: mef_immobili
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mef_user -d mef_immobili" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mef-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: mef-backend:latest
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: mef-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://mef_user:mef_password@db:5432/mef_immobili
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false 
    volumes:
      - ../../backend/data/FOLDER_DATASET:/app/data/FOLDER_DATASET
      - ../../backend/data/FOLDER_STATIC_ROME:/app/data/FOLDER_STATIC_ROME
      - ../../backend/data/FOLDER_APE:/app/data/FOLDER_APE
      - ../../backend/data/FOLDER_META:/app/data/FOLDER_META
      - ../../backend/data/FOLDER_DATABASE:/app/data/FOLDER_DATABASE
      - ../../backend/data/runs:/app/runs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: mef-frontend:latest
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: mef-frontend
    restart: always
    ports:
      - "8890:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
