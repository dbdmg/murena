repos:
  # Formatter Python principale (usa Black per formattare il codice)
  # Documentazione: https://github.com/psf/black
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        # Usa la versione di Python del progetto (modifica se necessario)
        language_version: python3

  # # Ordinatore di import (mantiene gli import ordinati e compatibili con Black)
  # # Documentazione: https://pycqa.github.io/isort/
  # - repo: https://github.com/PyCQA/isort
  #   rev: 5.13.2
  #   hooks:
  #     - id: isort
  #       name: isort (ordina gli import Python)
  #       # Il profilo "black" assicura che isort e black non vadano in conflitto
  #       args: ["--profile", "black"]

  # # Linter veloce per Python (trova errori e code smell)
  # # Documentazione: https://docs.astral.sh/ruff/
  # - repo: https://github.com/astral-sh/ruff-pre-commit
  #   rev: v0.6.9
  #   hooks:
  #     - id: ruff
  #       name: ruff (lint Python)
  #       # --fix prova a correggere automaticamente i problemi semplici
  #       args: ["--fix"]

  # # Hook generici di qualità (spazi finali, EOF, merge conflict, ecc.)
  # # Documentazione: https://github.com/pre-commit/pre-commit-hooks
  # - repo: https://github.com/pre-commit/pre-commit-hooks
  #   rev: v4.6.0
  #   hooks:
  #     # Evita di committare file enormi per errore
  #     - id: check-added-large-files
  #     # Impedisce di committare marker di conflitto git rimasti nel codice
  #     - id: check-merge-conflict
  #     # Garantisce una newline alla fine dei file di testo
  #     - id: end-of-file-fixer
  #     # Rimuove spazi bianchi inutili a fine riga
  #     - id: trailing-whitespace
